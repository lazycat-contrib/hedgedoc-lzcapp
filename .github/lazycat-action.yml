version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: hedgedoc
build:
  toolchains: []
  run_buildscript: false
images:
  - id: hedgedoc
    target: service
    service: hedgedoc
    source: hedgedoc/hedgedoc
    channel: stable
    sort: semver
    tag_regex: '^1[.]12[.][0-9]+$'
    image_template: quay.1ms.run/hedgedoc/hedgedoc:{tag}
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: HedgeDoc
    skip_if_version_exists: true
